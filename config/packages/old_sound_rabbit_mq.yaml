old_sound_rabbit_mq:
  connections:
    default:
      url: '%env(RABBITMQ_URL)%'
  #    producers:
  #        # use 'old_sound_rabbit_mq.task_producer' service to send data.
  #        task:
  #            connection:       default
  #            exchange_options: { name: 'task', type: direct }
  #    consumers:
  #        task:
  #            connection:       default
  #            exchange_options: { name: 'task', type: direct }
  #            queue_options:    { name: 'task'}
  #            callback:         App\Consumer\TaskConsumer

  producers:
    add_followers:
      connection: default
      exchange_options: { name: 'old_sound_rabbit_mq.add_followers', type: direct }

  consumers:
    add_followers:
      connection: default
      exchange_options: { name: 'old_sound_rabbit_mq.add_followers', type: direct }
      queue_options: { name: 'old_sound_rabbit_mq.consumer.add_followers' }
      callback: App\Controller\Amqp\AddFollowers\Consumer
      idle_timeout: 300
      idle_timeout_exit_code: 0
      graceful_max_execution:
        timeout: 1800
        exit_code: 0
      qos_options: { prefetch_size: 0, prefetch_count: 30, global: false }
